services:
  next:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      CONTENT_SOURCE: ${CONTENT_SOURCE:-demo}
      BITRIX_API_URL: ${BITRIX_API_URL:-}
    ports:
      - '${NEXT_PORT:-3000}:3000'
