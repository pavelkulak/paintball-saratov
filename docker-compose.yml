services:
  next:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      BITRIX_API_URL: ${BITRIX_API_URL:?Set BITRIX_API_URL in the deployment environment}
    ports:
      - '${NEXT_PORT:-3000}:3000'
